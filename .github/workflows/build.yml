name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Cache WebView2 bootstrapper
        uses: actions/cache@v4
        with:
          path: redist/
          key: webview2-bootstrapper-${{ runner.os }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Run tests
        run: |
          python -m unittest test_updates.py
          python smoke.py

      - name: Set build version
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
            "APP_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          } else {
            "APP_VERSION=0.0.0-dev" >> $env:GITHUB_ENV
          }

      - name: Build installer
        run: python build.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstagramFollowerReport-Setup
          path: Output/InstagramFollowerReport-Setup-v*.exe
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          NOTES=""
          if [[ -f CHANGELOG.md ]]; then
            # Grab the first ## section body (everything between the first and second ## headers)
            NOTES=$(awk '/^## / { if (p) exit; p=1; next } p' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          fi
          if [[ -z "$NOTES" ]]; then
            NOTES="Automated release from commit ${{ github.sha }}."
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: InstagramFollowerReport-Setup
          path: installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---
            Download the Windows installer below and run it on Windows 10/11 to install.
          files: installer/InstagramFollowerReport-Setup-v*.exe
          make_latest: true
